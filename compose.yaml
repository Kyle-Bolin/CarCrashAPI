services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: carcrash
      POSTGRES_PASSWORD: carcrash
      POSTGRES_DB: carcrash
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carcrash -d carcrash"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://carcrash:carcrash@db:5432/carcrash
      PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
