name: Terraform

# Static checks run on every change under infra/. The plan job stays skipped until
# the read-only OIDC plan role exists (#30) and its ARN is saved as the repository
# variable AWS_PLAN_ROLE_ARN, alongside AWS_REGION.
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "true"
  TERRAFORM_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.64.0"

jobs:
  checks:
    name: fmt, validate, tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_tf: ${{ steps.detect.outputs.has_tf }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Terraform code
        id: detect
        run: |
          if [ -z "$(find infra -name '*.tf' -print -quit 2>/dev/null)" ]; then
            echo "::notice::No Terraform code under infra/ yet; nothing to check."
            echo "has_tf=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_tf=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.detect.outputs.has_tf == 'true'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        if: steps.detect.outputs.has_tf == 'true'
        run: terraform fmt -check -recursive -diff infra

      - name: terraform validate (each root module)
        if: steps.detect.outputs.has_tf == 'true'
        run: |
          shopt -s nullglob
          for dir in infra/bootstrap infra/envs/*; do
            [ -n "$(find "$dir" -maxdepth 1 -name '*.tf' -print -quit 2>/dev/null)" ] || continue
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        if: steps.detect.outputs.has_tf == 'true'
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        if: steps.detect.outputs.has_tf == 'true'
        run: tflint --chdir=infra --recursive --format=compact

  plan:
    # GitHub appends the matrix value, e.g. "Plan (staging)". An explicit
    # ${{ matrix.* }} in the name shows up unexpanded when the job is skipped.
    name: Plan
    needs: checks
    if: >-
      github.event_name == 'pull_request'
      && needs.checks.outputs.has_tf == 'true'
      && vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC token for AWS; no stored AWS keys
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, prod]
    env:
      ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir="infra/envs/$ENVIRONMENT" init -input=false -no-color

      # -lock=false: the plan role is read-only and cannot write the state lock.
      - name: terraform plan
        run: |
          terraform -chdir="infra/envs/$ENVIRONMENT" plan -input=false -lock=false -no-color -out=tfplan
          {
            echo "### Terraform plan: $ENVIRONMENT"
            echo '```'
            terraform -chdir="infra/envs/$ENVIRONMENT" show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # TODO(#35): also post the plan summary as a PR comment.
